# Les noms des services servent de noms d'hôte sur le réseau Compose :
# web appelle "words:8080" et words appelle "db:5432" (en dur dans le code)

services:
  db:
    build: ./db
    # Pas de "ports" : la base n'est joignable que depuis le réseau interne
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      timeout: 3s
      retries: 15

  words:
    build: ./words
    # Pas de "ports" non plus : seul web l'appelle
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./web
    # Seul service accessible de l'extérieur : http://localhost:8080
    ports:
      - "8080:80"
    # Développement : le dossier static/ de la machine remplace celui de
    # l'image. Le serveur relit les fichiers à chaque requête, donc une
    # modification HTML/CSS est visible en rafraîchissant la page,
    # sans rebuild ni redémarrage
    volumes:
      - ./web/static:/app/static
    depends_on:
      - words
