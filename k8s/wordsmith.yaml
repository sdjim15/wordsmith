# Déploiement de wordsmith sur Kubernetes
# Les noms des Services (db, words) servent de noms DNS dans le cluster :
# web appelle "words:8080" et words appelle "db:5432" (en dur dans le code)

# ---------- db : PostgreSQL ----------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
        - name: db
          image: jpetazzo/wordsmith-db:latest
          env:
            - name: POSTGRES_HOST_AUTH_METHOD
              value: trust
          ports:
            - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: db
spec:
  # ClusterIP : joignable seulement depuis l'intérieur du cluster
  type: ClusterIP
  selector:
    app: db
  ports:
    - port: 5432
      targetPort: 5432
---
# ---------- words : API REST Java ----------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: words
spec:
  replicas: 1
  selector:
    matchLabels:
      app: words
  template:
    metadata:
      labels:
        app: words
    spec:
      containers:
        - name: words
          image: jpetazzo/wordsmith-words:latest
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: words
spec:
  type: ClusterIP
  selector:
    app: words
  ports:
    - port: 8080
      targetPort: 8080
---
# ---------- web : frontend Go ----------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: jpetazzo/wordsmith-web:latest
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  # Seul service exposé à l'extérieur du cluster.
  # Avec Docker Desktop, un LoadBalancer est publié sur localhost :
  # http://localhost:8080
  type: LoadBalancer
  selector:
    app: web
  ports:
    - port: 8080
      targetPort: 80
